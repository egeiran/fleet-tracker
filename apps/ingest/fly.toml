# Deploy from the repository root: fly launch --config apps/ingest/fly.toml --no-deploy ; fly deploy --config apps/ingest/fly.toml
app = "vakt-ingest"
primary_region = "arn"

[build]
  dockerfile = "apps/ingest/Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/ingest.sqlite"
  LOG_LEVEL = "info"

[mounts]
  source = "ingest_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The AIS stream must stay connected, so the machine never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  # One machine and one volume: rolling deploys cannot share the SQLite file.
  strategy = "immediate"
